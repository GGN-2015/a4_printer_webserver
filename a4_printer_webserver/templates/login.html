<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='login.js') }}" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">中文</button>
        </div>
        <div class="brand-mark" aria-hidden="true">A4</div>
        <h1 id="login-title">{{ title }}</h1>
        <p class="login-subtitle" data-i18n="protected">Protected printer access</p>
        {% if error %}
          <p class="form-error" role="alert" data-error="{{ error }}"></p>
        {% endif %}
        <form method="post" class="login-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label for="password" data-i18n="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            autofocus
            autocomplete="current-password"
            data-i18n-placeholder="passwordPlaceholder"
          >
          <button type="submit" class="primary" data-i18n="signIn">Sign in</button>
        </form>
      </section>
    </main>
  </body>
</html>
